spring:
  # 비동기(@Async) 스레드 풀. Spring Boot 기본 실행기 설정 (기존 AsyncConfig와 같은 값)
  task:
    execution:
      thread-name-prefix: Async-
      pool:
        core-size: 3
        max-size: 5
        queue-capacity: 10
  application:
    name: TicketCore
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${DDL_ENV}
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100


  # 서비스 간 HTTP 호출 타임아웃 (Feign 기본값과 같게 유지)
  http:
    client:
      connect-timeout: 10s
      read-timeout: 60s

springdoc:
  swagger-ui:
    path: ${SWAGGER_PATH}/swagger-ui.html
  api-docs:
    path: ${SWAGGER_PATH}/api-docs

# 임시: api-gateway가 ticket-core를 라우팅하기 전까지 브라우저에서 직접 테스트하기 위한 설정.
# 게이트웨이 라우팅을 마치면(7~8단계) CORS를 게이트웨이로 옮기고 이 블록을 지운다.
cors:
  allowed:
    path: ${ALLOWED_PATH}
    pattern: ${ALLOWED_PATTERN}
    method: ${ALLOWED_METHOD}


itoms:
  swagger:
    title: Ticket Core API Document
    description: Itoms Ticket Core 기능을 수행하는 API document 페이지 입니다
