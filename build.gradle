plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

// common 같은 폴더용 프로젝트는 빼고, 실제 모듈에만 적용한다.
configure(subprojects.findAll { it.subprojects.isEmpty() }) {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.capston_design.fkiller.itoms'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        mavenCentral()
    }

    // Boot 플러그인이 없는 모듈(이후 common, contracts)도 같은 버전을 쓰도록 BOM을 직접 가져온다.
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom libs.spring.cloud.dependencies.get().toString()
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // 서비스는 실행용 jar(bootJar) 하나만 만든다. -plain.jar가 같이 생기면 Dockerfile의 *.jar가 두 개를 잡는다.
    plugins.withId('org.springframework.boot') {
        tasks.named('jar') { enabled = false }
    }
}
