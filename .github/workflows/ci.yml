# 레포 전체 CI.
# - 모든 PR과 main 푸시: 전체 빌드 + 테스트
# - 바뀐 서비스만 Docker 이미지 빌드. 공통 모듈·빌드 설정이 바뀌면 전체 서비스
# - main 푸시일 때만 이미지를 GHCR(ghcr.io/<owner>/itoms-<서비스>)에 올린다. PR에서는 빌드만 확인
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: 테스트 리포트 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  changes:
    name: 바뀐 서비스 찾기
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'common/**'
              - 'contracts/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            api-gateway: 'api-gateway/**'
            service-desk: 'service-desk/**'
            user-service: 'user-service/**'
            ticket-core: 'ticket-core/**'
            service-request-management: 'service-request-management/**'
      - id: pick
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          all='["api-gateway","service-desk","user-service","ticket-core","service-request-management"]'
          if echo "$CHANGES" | jq -e 'index("shared")' > /dev/null; then
            services="$all"
          else
            services=$(echo "$CHANGES" | jq -c 'map(select(. != "shared"))')
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "이미지를 빌드할 서비스: $services"

  image:
    name: 이미지 (${{ matrix.service }})
    needs: [build, changes]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/itoms-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/itoms-${{ matrix.service }}:${{ github.sha }}
          # 패키지를 이 레포와 연결한다 (GitHub Packages 화면에 레포가 표시됨)
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
