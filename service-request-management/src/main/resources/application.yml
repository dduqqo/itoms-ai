spring:
  # 비동기(@Async) 스레드 풀. Spring Boot 기본 실행기 설정 (기존 AsyncConfig와 같은 값)
  task:
    execution:
      thread-name-prefix: Async-
      pool:
        core-size: 3
        max-size: 5
        queue-capacity: 10
  application:
    name: ServiceRequestManagement
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_ENV}
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  cloud:
    openfeign:
      client:
        config:
          default:
            logger-level: ${LOGGER_LEVEL}
          ticket-core:
            url: ${TICKET_CORE_URL}

springdoc:
  swagger-ui:
    path: ${SWAGGER_PATH}/swagger-ui.html
  api-docs:
    path: ${SWAGGER_PATH}/api-docs

itoms:
  swagger:
    title: Service Request Management API Document
    description: Itoms Service Request Management 기능을 수행하는 API document 페이지 입니다
