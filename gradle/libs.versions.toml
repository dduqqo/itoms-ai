# 모든 버전은 여기서만 관리한다. Spring Boot/Cloud BOM이 관리하는 의존성은 버전 없이 build.gradle에 적는다.
[versions]
spring-boot = "3.4.13"
spring-dependency-management = "1.1.7"
spring-cloud = "2024.0.3"
springdoc = "2.8.8"
loki-logback = "1.3.2"
datasource-micrometer = "1.0.1"

[libraries]
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
springdoc-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
loki-logback-appender = { module = "com.github.loki4j:loki-logback-appender", version.ref = "loki-logback" }
datasource-micrometer = { module = "net.ttddyy.observation:datasource-micrometer-spring-boot", version.ref = "datasource-micrometer" }

[bundles]
springdoc = ["springdoc-webmvc-api", "springdoc-webmvc-ui"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
